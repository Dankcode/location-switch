<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="location-token" content="__TOKEN__">
  <title>Location Switch</title><link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/style.css"><script src="/static/app.js" defer></script>
</head>
<body>
<main class="utility">
  <header class="toolbar"><svg viewBox="0 0 64 64" aria-hidden="true"><path d="M57 7 8 29l24 3 3 24Z"/></svg><h1>Location Switch</h1><span class="connection-type">USB</span></header>
  <div class="content">
    <section class="panel device-panel" aria-label="Device">
      <div class="device-row"><label for="device" class="sr-only">Connected device</label><select id="device"><option value="">Connect an iPhone</option></select><button id="refresh" class="quiet">Refresh</button><button id="enable-developer-mode" class="outline" aria-label="Enable Developer Mode" title="Reveals the Settings toggle without Xcode; automatic enabling may restart your iPhone." disabled>Enable Dev Mode</button></div>
      <div class="device-status"><p id="status" class="status" role="status"><span class="dot"></span><span id="status-text">Location unknown</span></p><p id="developer-status" role="status">Dev Mode unknown</p></div>
    </section>
    <section class="panel location-panel" aria-labelledby="destination-title">
      <div class="section-toolbar"><h2 id="destination-title">Location</h2><button id="map-toggle" class="text-button" aria-expanded="false" aria-controls="map-panel" title="OpenStreetMap tiles load only when opened. The viewed area is sent to the tile provider.">Show map</button></div>
      <form id="search-form" class="search-row"><input id="address" aria-label="Address or place" placeholder="Address or place" minlength="3" maxlength="250" required><button id="search" type="submit">Search</button></form>
      <div id="results" class="results" aria-label="Address results" hidden></div>
      <div class="coordinates"><div class="coordinate-field"><label for="latitude">Latitude</label><input id="latitude" type="number" min="-90" max="90" step="any" placeholder="−90 to 90" inputmode="decimal"></div><div class="coordinate-field"><label for="longitude">Longitude</label><input id="longitude" type="number" min="-180" max="180" step="any" placeholder="−180 to 180" inputmode="decimal"></div></div>
      <p id="selected" class="selected">No destination</p>
      <div id="map-panel" hidden><div id="map" aria-label="Destination map"></div><p id="map-status" role="status">Click the map to select a destination · OSM tiles are sent to your browser.</p></div>
      <div class="actions"><button id="spoof" disabled>Spoof location</button><button id="restore" class="outline" disabled>Real location</button></div>
      <p id="message" role="alert" hidden></p>
    </section>
  </div>
  <footer><a href="https://github.com/doronz88/pymobiledevice3" target="_blank" rel="noreferrer">pymobiledevice3</a><span><a href="https://github.com/komoot/photon" target="_blank" rel="noreferrer" title="Address searches are sent to Photon">Photon</a> · <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noreferrer">© OpenStreetMap</a></span></footer>
</main>
</body>
</html>
