[project]
name = "location-switch"
version = "0.1.0"
description = "A local iPhone location simulation switch powered by pymobiledevice3"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.27,<1", "pymobiledevice3"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2"]

[tool.uv.sources]
pymobiledevice3 = { git = "https://github.com/doronz88/pymobiledevice3.git", rev = "3a173489266e23b5574a89b3c152fb290b760024" }

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
